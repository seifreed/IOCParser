[worker]
queue_backend = rabbitmq
queue_name = ingest
poll_interval_seconds = 0.5
max_messages_per_cycle = 4
max_cycles =
concurrency = 4
telemetry_mode = logging

[runtime]
max_input_size_bytes = 10485760
memory_limit_bytes = 1073741824
cpu_seconds = 300
hard_timeout_seconds = 60

[network]
max_input_seconds = 30
max_queue_size = 128
skip_processed = true
