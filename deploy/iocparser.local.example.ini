[database]
uri = sqlite:///iocparser.local.db

[worker]
queue_backend = filesystem
queue_name = ingest
queue_path = .iocparser-queue
poll_interval_seconds = 0.2
max_messages_per_cycle = 2
concurrency = 1
telemetry_mode = logging

[runtime]
max_input_size_bytes = 5242880
memory_limit_bytes = 268435456
cpu_seconds = 60
hard_timeout_seconds = 15

[network]
max_input_seconds = 15
max_queue_size = 32
skip_processed = true
