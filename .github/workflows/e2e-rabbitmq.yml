name: E2E RabbitMQ

on:
  workflow_dispatch:

jobs:
  rabbitmq-e2e:
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:3.13
        ports:
          - 5672:5672
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,pipeline]"

      - name: Run RabbitMQ E2E harness
        env:
          IOCPARSER_E2E_RABBITMQ_URL: amqp://guest:guest@localhost:5672/
          IOCPARSER_E2E_DB_URI: sqlite:///rabbitmq-e2e.sqlite
        run: |
          pytest tests/e2e_rabbitmq_harness.py -q -p no:cacheprovider
