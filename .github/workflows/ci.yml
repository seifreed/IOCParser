name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.13', '3.14']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libmagic1

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Lint with ruff
      run: |
        ruff check iocparser tests

    - name: Check formatting with ruff
      run: |
        ruff format --check iocparser tests

    - name: Type check with mypy
      run: |
        mypy iocparser

    - name: Enforce architecture guardrails
      run: |
        make arch-guard

  test-quick:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'
        cache: pip

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libmagic1

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run fast functional suite
      run: |
        make test-quick

  test:
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs_on: ubuntu-24.04
            platform: linux-x64
            python-version: '3.13'
            upload_coverage: false
          - runs_on: ubuntu-24.04
            platform: linux-x64
            python-version: '3.14'
            upload_coverage: true
          - runs_on: ubuntu-24.04-arm
            platform: linux-arm64
            python-version: '3.13'
            upload_coverage: false
          - runs_on: ubuntu-24.04-arm
            platform: linux-arm64
            python-version: '3.14'
            upload_coverage: false
          - runs_on: windows-2025
            platform: windows-x64
            python-version: '3.13'
            upload_coverage: false
          - runs_on: windows-2025
            platform: windows-x64
            python-version: '3.14'
            upload_coverage: false
          # windows-11-arm excluded: cryptography has no official wheels for Windows ARM64
          - runs_on: macos-15-intel
            platform: macos-intel
            python-version: '3.13'
            upload_coverage: false
          - runs_on: macos-15-intel
            platform: macos-intel
            python-version: '3.14'
            upload_coverage: false
          - runs_on: macos-15
            platform: macos-arm64
            python-version: '3.13'
            upload_coverage: false
          - runs_on: macos-15
            platform: macos-arm64
            python-version: '3.14'
            upload_coverage: false

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip

    - name: Install Linux system dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libmagic1

    - name: Install macOS system dependencies
      if: runner.os == 'macOS'
      run: |
        brew install libmagic

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run functional tests with pytest
      shell: bash
      run: |
        python -m pytest tests/ -q -m "not benchmark" \
          --cov=iocparser \
          --cov-fail-under=100 \
          --cov-report=term-missing \
          $([ "${{ matrix.upload_coverage }}" = "true" ] && printf '%s ' --cov-report=html --cov-report=xml) \
          -p no:cacheprovider

    - name: Run architecture tests explicitly
      shell: bash
      run: |
        pytest tests/test_architecture.py -v -p no:cacheprovider

    - name: Upload coverage to Codecov
      if: matrix.upload_coverage
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-${{ matrix.platform }}-py${{ matrix.python-version }}
        fail_ci_if_error: false

  security:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'
        cache: pip

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libmagic1

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
        pip install pip-audit

    - name: Security check with bandit
      run: |
        bandit -r iocparser -f json -o bandit-report.json

    - name: Security check with pip-audit
      run: |
        pip-audit --ignore-vuln CVE-2026-3219

  benchmark:
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'
        cache: pip

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libmagic1

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run benchmark suite
      run: |
        make test-benchmark

  build:
    needs: [lint, test-quick, test]
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'
        cache: pip

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      run: |
        python -m build

    - name: Check package with twine
      run: |
        twine check dist/*

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/

  publish:
    needs: [lint, test-quick, test, security, build]
    runs-on: ubuntu-24.04
    if: github.event_name == 'release' && github.event.action == 'published'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'
        cache: pip

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      run: |
        python -m build

    - name: Publish to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        twine upload dist/*
